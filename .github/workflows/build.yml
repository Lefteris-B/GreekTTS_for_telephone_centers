name: Build Windows executable

# Trigger rules:
#   - Push to main → builds and uploads CI artifact (90-day retention)
#   - Push a tag like v1.0.0 → additionally creates a GitHub Release
#   - Manual dispatch from the Actions tab - useful for testing
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # 90 min ceiling - torch + cuda install alone can take 20+ min
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # No pip cache - torch CUDA wheels are too big to cache reliably
          # and we want a clean build each time.

      - name: Show runner specs
        shell: pwsh
        run: |
          Write-Host "Python:"
          python --version
          Write-Host "Disk space:"
          Get-PSDrive C | Select-Object Used, Free
          Write-Host "Pip:"
          python -m pip --version

      # ----- Install PyTorch with CUDA 12.8 from PyTorch's index -----
      # Done separately because pip needs a different index URL for these
      # wheels - they aren't on PyPI. torchvision must be installed here too:
      # unsloth pulls it in, and an unpinned torchvision from PyPI drags in
      # the CPU-only torch wheel, silently replacing the CUDA build.
      # torch/torchaudio 2.11 is the newest pair with Windows torchaudio wheels.
      - name: Install PyTorch (CUDA 12.8)
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          pip install torch==2.11.0+cu128 torchvision==0.26.0+cu128 torchaudio==2.11.0+cu128 --index-url https://download.pytorch.org/whl/cu128
          # Lock the CUDA builds so later installs can't swap them out
          "torch==2.11.0+cu128`ntorchvision==0.26.0+cu128`ntorchaudio==2.11.0+cu128" | Out-File -Encoding ascii torch-constraints.txt

      # ----- Install everything else from requirements.txt -----
      - name: Install application dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # bitsandbytes for Windows + 4-bit quantization
          pip install -r requirements.txt bitsandbytes -c torch-constraints.txt --extra-index-url https://download.pytorch.org/whl/cu128

      # ----- PyInstaller -----
      - name: Install PyInstaller
        shell: pwsh
        run: pip install pyinstaller

      - name: Verify imports before build
        # Fail fast if any module can't import. Catches missing deps
        # before we burn 30 min on PyInstaller.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -c "import torch, sys; print('torch', torch.__version__, 'cuda', torch.version.cuda); sys.exit(0 if torch.version.cuda else 'torch is a CPU-only build')"
          python -c "import torchaudio; print('torchaudio', torchaudio.__version__)"
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -c "import transformers; print('transformers', transformers.__version__)"
          python -c "import unsloth; print('unsloth imported')"
          python -c "import peft; print('peft', peft.__version__)"
          python -c "import snac; print('snac imported')"
          python -c "import bitsandbytes; print('bitsandbytes', bitsandbytes.__version__)"

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller packaging/GreekTTS.spec --noconfirm --clean

      # ----- Smoke test: does the exe at least start without crashing? -----
      # We can't truly run the app on a CI runner (no GPU), but we can
      # verify the binary's process tree spins up far enough to fail with
      # an *expected* error (CUDA not available) rather than a packaging
      # error (missing module, DLL not found, etc.).
      - name: Smoke test the executable
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "dist\GreekTTS\GreekTTS.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Build produced no executable at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Executable size: $([math]::Round($size, 1)) MB"
          Write-Host "Full build folder size:"
          $folder = (Get-ChildItem dist\GreekTTS -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "$([math]::Round($folder, 1)) MB"

      # ----- Bundle into a split 7z archive for distribution -----
      # The CUDA build is ~4.8 GB unpacked and ~3 GB even zipped, but GitHub
      # Release assets must be under 2 GB each. So: 7z volumes of 1900 MB
      # (GreekTTS-windows-<ver>.7z.001, .002, ...). Users open .001 with 7-Zip.
      - name: Create distributable archive
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF -replace "refs/tags/", "" } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $archiveName = "GreekTTS-windows-$version.7z"

          # Stage the release layout in a temp folder so setup.cmd ends up
          # at the top level of the archive alongside the GreekTTS folder.
          $stageDir = "release-stage"
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item -Recurse "dist\GreekTTS" "$stageDir\GreekTTS"
          Copy-Item "setup.cmd" "$stageDir\setup.cmd"
          if (Test-Path "INSTALL-WINDOWS.md") {
            Copy-Item "INSTALL-WINDOWS.md" "$stageDir\INSTALL-WINDOWS.md"
          }
          if (Test-Path "README.md") {
            Copy-Item "README.md" "$stageDir\README.md"
          }

          New-Item -ItemType Directory -Path "release-out" | Out-Null
          7z a -t7z -mx=5 -mmt=on -v1900m "release-out\$archiveName" ".\$stageDir\*"
          Write-Host "Archive parts:"
          Get-ChildItem release-out | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      # ----- Upload as CI artifact (every build) -----
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreekTTS-windows
          path: release-out/*
          retention-days: 90

      # ----- On tag push, additionally attach to a GitHub Release -----
      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*
          body: |
            **Download all `GreekTTS-windows-*.7z.0xx` parts** into the same folder,
            then open the `.7z.001` file with [7-Zip](https://www.7-zip.org/) and extract.
            See the install guide in `Docs/Install_Windows_guide.md`.
          generate_release_notes: true
          # Mark pre-releases for v0.x or v*-rc/beta/alpha tags
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') || startsWith(github.ref, 'refs/tags/v0.') }}